<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/4.0.0/jquery.min.js"></script>
    <title>Miku Miku Match</title>
    <link rel="icon" type="image/x-icon" href="images/site_icon.ico">
    <link rel="stylesheet" href="style/style.css">
    <link href='https://fonts.googleapis.com/css?family=Bubblegum Sans' rel='stylesheet'>
    <script src="countries.js"></script>
    <script>
        //I hope the person reading this is hungry because the mess below sure is a whole lot of spagetti!!
        //proof my code is human made? just look at it. I am the opposite of AI, I am geniuene stupidity
        $(function(){


            //***************************************************************************
            //***********************HEADER***************************************   
            //***************************************************************************
            let gemsAmount;
            if(localStorage.getItem("gems") == null){
                localStorage.setItem("gems","200");
            }
            gemsAmount = parseInt(localStorage.getItem("gems"));
            $("#gemsAmount").text(gemsAmount)

                        
            let energy;
            let maximumEnergy = 24;
            let regenerationTimeMinutes = 25;

            if (localStorage.getItem("lastUpdate") == null) {
                localStorage.setItem("lastUpdate", Date.now());
            }

            if (localStorage.getItem("energy") == null) {
                localStorage.setItem("energy", maximumEnergy.toString());
            }

            energy = Math.floor(
                (Date.now() - parseInt(localStorage.getItem("lastUpdate"))) /
                (regenerationTimeMinutes * 60000)
            ) + parseInt(localStorage.getItem("energy"));

            if (energy > maximumEnergy) energy = maximumEnergy;

            let elapsed = Date.now() - parseInt(localStorage.getItem("lastUpdate"));
            let regenerated = Math.floor(elapsed / (regenerationTimeMinutes * 60000));

            localStorage.setItem(
                "lastUpdate",
                parseInt(localStorage.getItem("lastUpdate")) +
                regenerated * (regenerationTimeMinutes * 60000)
            );

            localStorage.setItem("energy", energy);

            $("#lifesAmount").text(energy);
            $("#lifesMax").text(maximumEnergy);

            let seconds = Math.floor(
                (Date.now() - parseInt(localStorage.getItem("lastUpdate"))) / 1000
            );

            let timeRemainingMinutes;
            let timeRemainingSeconds;
            let timeRemaining;

            setInterval(function() {
                if (energy < maximumEnergy) {
                    seconds++;

                    if (seconds <= regenerationTimeMinutes * 60) {
                        timeRemainingMinutes = regenerationTimeMinutes - Math.ceil(seconds / 60);
                        timeRemainingSeconds = (regenerationTimeMinutes * 60) - seconds - timeRemainingMinutes * 60;

                        timeRemaining = `${String(timeRemainingMinutes).padStart(2, "0")}:${String(timeRemainingSeconds).padStart(2, "0")}`;
                    } else {
                        seconds = 0;
                        energy += 1;

                        localStorage.setItem("energy", energy);

                        localStorage.setItem(
                            "lastUpdate",
                            parseInt(localStorage.getItem("lastUpdate")) + regenerationTimeMinutes * 60000
                        );

                        $("#lifesAmount").text(energy);
                    }
                } else {
                    timeRemaining = "";
                }

                $("#timeRemaining").text(timeRemaining);
            }, 1000);

            //***************************************************************************
            //***************************************************************************   
            //***************************************************************************



            //***************************************************************************
            //***********************KOD DO EKRANU TYTUŁOWEGO****************************   
            //***************************************************************************
            $("#titleLogo").show();
            $('.prettyBtn').on('mouseenter', function() {
                const sound = $('#hoverSound')[0];
                sound.currentTime = 0;
                sound.play();
            });
            $('.prettyBtn').click(function() {
                const sound = $('#clickSound')[0];
                sound.currentTime = 0;
                sound.play();
                $("#titleScreen").hide();
                $("#mainMenu").show().css("display","flex");
            });

            $(".headerLogo").eq(0).click(function(){
                const sound = $('#mikuSound')[0];
                sound.currentTime = 0;
                sound.play();
            })

            let musicPlaying = false;//z automatu nie leci :( limitacje przegladarki

            $(document).on("mousemove",function(){
                if(!musicPlaying){
                    const music = $("#bgm_menu")[0];
                    music.currentTime = 0;
                    music.volume = 0.5;
                    music.play();
                    musicPlaying = true;
                }
            })


            //***************************************************************************
            //***************************************************************************   
            //***************************************************************************


            //***************************************************************************
            //***********************KOD DO ROZGRYWKI***************************************   
            //***************************************************************************


            //ads switching up <3 gotta make money
            
            counter = 0;
            setInterval(function(){
                let adLinks = ["https://piapro.net/intl/en.html", "https://games4you.pl/produkt/hatsune-miku-project-mirai-dx-3ds/","https://open.spotify.com/artist/7HwMt9qpoww4yfE3D8886I","https://store.steampowered.com/app/1761390/Hatsune_Miku_Project_DIVA_Mega_Mix/"];
                for (let i = 1; i <= 4; i++) {
                    let imageNumber = ((i + counter - 1) % 4) + 1;
                    $(".adRedirect").eq(i-1).attr("href", adLinks[imageNumber-1]);
                    $("#ad" + i).attr("src", `images/ads/${imageNumber}.jpg`);
                }
                if(counter < 4) counter +=1; else counter = 0;
     
            },500);

            let selectedDifficulty;
            //soon this game will be like half life and will require coconut.png to not crash 
            $("#playBtn").attr("disabled","disabled")//LOOKS DUMB BUT OTHERWISE REFUSES TO WORK (god knows why, because neither me nor does chat GPT know and sure as hell i ain't paying for claude or any ai <//3 
            $(".difficultySelect").click(function(){
                selectedDifficulty = $(this).data("difficulty");
                let soundEffect = $(`#${selectedDifficulty}Sound`)[0];
                soundEffect.volume = 1;
                soundEffect.currentTime = 0;
                soundEffect.play();
                $(this).addClass("difficultySelected");
                $(this).removeClass("unfocused")
                let everythingElse = $(".difficultySelect").not(this);
                everythingElse.addClass("unfocused");
                everythingElse.removeClass("difficultySelected");
                $("#playBtn").removeAttr("disabled")
                console.log(selectedDifficulty)
                
            });


            let difficultyCards = {"easy":6,"normal":8,"hard":10};
            let cardset = ["miku","rin","len","luka","kaito","meiko","gackpo","gumi","adachi_rei","ia"];


            function cardGeneration(amount){
                //simple for loop, haven't seen that guy for a while <///3
                let cards = [];
                let cardSpreadList = [];
                for(let i = 0; i < amount; i++){
                    for( let j =0; j < 2; j++){
                        cards.push(`<img src="images/cards/back.png" data-character="${cardset[i]}">`);
                    }
                }
                //nie mam pojęcia co ja tutaj robię, jeśli to zadziała to się zdziwię. złożoność obliczeniowa prawdopodbnie będzie koszmarnie duża...ale co z tego? każdy ma ram, prawda? :)
                //NIEE CHCEEEEE DJAIOFHAOKLTJSMOIRLGSJO;
                //a mogłam w GTA pykać.. (nie stać mnie)
                //Lucia na mnie czeka
                
            
                let randomCard; 

                while(cards.length > 0){
                    randomCard = Math.floor(Math.random() * cards.length);
                    cardSpreadList.push(cards.splice(randomCard, 1)[0]);
                }
                console.log(cardSpreadList)
            }


            $("#playBtn").click(function(){
                $("#mainMenu").hide();
                $("#game").show();
                energy -= 1;
                localStorage.setItem("energy",energy.toString());
                $("#bgm_menu")[0].pause();
                $.getJSON("audio/music/music_info.json", function(data) {

                    let bound = data.music.length;
                    let random_song = Math.floor(Math.random() * bound);

                    let title = data.music[random_song].title;
                    let artist = data.music[random_song].artist;
                    let filePath = data.music[random_song].file_path;
                    let cover = data.music[random_song].cover;

                    let audio = $("#songControls")[0];

                    audio.src = `audio/music/${filePath}`;
                    audio.currentTime = 0;
                    audio.play();

                    $("#albumCover").attr("src", `audio/music/${cover}`);
                    $("#title").text(title);
                    $("#artist").text(artist);
                    cardGeneration(difficultyCards[selectedDifficulty]);
                });

            });
            
            //*******************MUZYKA*******************************************************************

            $.getJSON("audio/music/music_info.json", function(data) {

                $.each(data.music, function(index, track) {
                    $("#trackSelect").append(`<div class="track" data-index="${index}"></div>`);
                    $(".track").eq(index).append(`<img src="audio/music/${track.cover}" class="previewCover">`);
                    $(".track").eq(index).append(`<div class="previewInfo"></div>`);
                    $(".previewInfo").eq(index).append(`<span class="previewTitle">${track.title}</span>`);
                    $(".previewArtist").eq(index).append(`<span class="previewArtist">${track.artist}</span>`);

                });

            });

            let audio = $("#songControls")[0];

            audio.addEventListener("play", function() {
                $("#albumCover").addClass("spinning");
            });

            audio.addEventListener("pause", function() {
                $("#albumCover").removeClass("spinning");
            });

            audio.addEventListener("ended", function() {
                $("#albumCover").removeClass("spinning");
            });

            $(document).on("mouseenter", ".track", function() {
                const sound = $("#hoverSound")[0];
                sound.currentTime = 0;
                sound.play();
            });

            $(document).on("click", ".track", function() {
                const sound = $("#clickSound")[0];
                sound.currentTime = 0;
                sound.play();
                let songID = parseInt($(this).data("index"));
                $.getJSON("audio/music/music_info.json", function(data) {
                    let title = data.music[songID].title;
                    let artist = data.music[songID].artist;
                    let filePath = data.music[songID].file_path;
                    let cover = data.music[songID].cover;

                    let audio = $("#songControls")[0];

                    audio.src = `audio/music/${filePath}`;
                    audio.currentTime = 0;
                    audio.play();

                    $("#albumCover").attr("src", `audio/music/${cover}`);
                    $("#title").text(title);
                    $("#artist").text(artist);

                });
            });
            //***************************************************************************

            $("#newGameBtn").click(function(){
                let audio = $("#songControls")[0];
                audio.pause();
                const music = $("#bgm_menu")[0];
                music.play();
                $("#mainMenu").show();
                $("#game").hide();

            })

            //***************************************************************************
            //***************************************************************************   
            //***************************************************************************









            //***************************************************************************
            //***********************KOD DO SKLEPU***************************************   
            //***************************************************************************

            $(".storeRedirect").click(function(){
                $("#difficultySelectDiv").hide();
                $("#shop").show();
                $("#payment").hide();
                $("#catalouge").show();

            })

            $.getJSON("product_list.json", function(data) {

                $.each(data.inventory, function(index, product) {
                    if(index % 3 == 0){
                        $("#offers").append("<tr></tr>")
                    } //given up on grid template, a table it is.
                    $("#offers tr").eq(Math.floor(index / 3)).append(`<td><div class="offer"></div></td>`);
                    $(".offer").eq(index).append(`<img src="images/shop/${product.image}">`);
                    $(".offer").eq(index).append(`<div class="productInfo"></div>`);
                    $(".productInfo").eq(index).append(`<p>${product.amount} ${product.type}</p>`);
                    $(".productInfo").eq(index).append(`<p>${product.price} ${product.currency}</p>`)
                    $(".productInfo").eq(index).append(`<button class="prettyBtn buyBtn" data-amount="${product.amount}" data-type="${product.type}" data-price="${product.price}" data-currency="${(product.currency == "$") ? "$":"g"}">buy</button>`)
                    

                });

            });

            //zmienne dla zakupu 
            let type = $(this).data("type");
            let amount = parseInt($(this).data("amount"));
            let price = parseInt($(this).data("price"));
            let currencies = $(this).data("currency");

            $(document).on("click", ".buyBtn", function(){//normalna składnia nie działała, musi być event delegation
                type = $(this).data("type");
                amount = parseInt($(this).data("amount"));
                price = parseInt($(this).data("price"));
                currencies = $(this).data("currency"); 
                if(type == "gems"){
                    $("#payment").show();
                    $("#catalouge").hide();
                }else{
                    if(energy + amount <=24){
                        gemsAmount -= price;
                        localStorage.setItem("gems",gemsAmount);
                        $("#gemsAmount").text(gemsAmount);
                        energy += amount;
                        localStorage.setItem("energy", energy);
                        $("#lifesAmount").text(energy);
                        $("#moneySound")[0].currentTime = 0;
                        $("#moneySound")[0].play();
                    }else{
                        alert("Can't buy excessive energy. Use up what you already have.")
                    }
                }

            });

            $("#shopExit").click(function(){
                $("#difficultySelectDiv").show();
                $("#shop").hide();
            })

            $("#back2shop").click(function(){
                $("#payment").hide();
                $("#catalouge").show();
            });


            $.each(countries, function(index, val) {
                $("#country").append(
                    `<option value="${val}">${val}</option>`
                );
            }); //lol didn't have to write 200+ countries by hand <3


            $("#paymentDetails").on("submit",function(event){
                event.preventDefault();
                let name = $("#name").val().trim();
                let lastName = $("#lastName").val().trim();
                let email = $("#email").val().trim();
                let phone = $("#phone").val().trim();
                let addressLine1 = $("#address1").val().trim();
                let addressLine2 = $("#address2").val().trim();
                let city = $("#city").val().trim();
                let zipCode = $("#zipCode").val().trim();
                let country = $("#country").val();
                let allVals = [name, lastName, email, phone, addressLine1, addressLine2, city, zipCode, country];
                let mandatory = allVals;
                mandatory.splice(5,1);//drugi parametr ze ma tylko jedno usunac
                
                
                if (mandatory.some(val => val === "")) { //fajna funkcja sprawdzający czy jakikolwiek element listy spełnia warunek <3
                    alert("Not all fields have gotten filled!!!"); //zamienić alert na ładniejszą wiadmość jak będzie mi się chciało <//3
                    return; 
                }
                
                const phoneRegex = /^\+?[0-9\s()-]{7,20}$/;
                const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
                const zipRegex = /^[A-Z0-9][A-Z0-9\s-]{1,10}$/i;
                if (!phoneRegex.test(phone)) {
                    alert("Invalid phone number!");
                    return;
                }

                if (!emailRegex.test(email)) {
                    alert("Invalid email!");
                    return;
                }

                if (!zipRegex.test(zipCode)) {
                    alert("Invalid ZIP code!");//zamienić alerty na ładniejsza wiadomość
                    return;
                }

                $(this).hide();
                $("#cardDetails").show().css("display","grid");
                
            })


            $("#cardDetails").on("submit",function(event){
                event.preventDefault();
                let cardNumber = $("#cardNumber").val().trim();
                let cvv = $("#cvv").val().trim();
                let expiration = $("#expiration").val().trim();

                const cardRegex = /^\d{13,19}$/;
                const cvvRegex = /^\d{3,4}$/;
                const expirationRegex = /^(0[1-9]|1[0-2])\/(\d{2}|\d{4})$/;

                if (!cardRegex.test(cardNumber)) {
                    alert("Invalid card number!");
                    return;
                }

                if (!cvvRegex.test(cvv)) {
                    alert("Invalid CVV!");
                    return;
                }

                if (!expirationRegex.test(expiration)) {
                    alert("Invalid expiration date!");
                    return;
                }
                
                let payment_sucess_chance = Math.ceil(Math.random()*100+10); //mialo byc stale ale zmieniłam zdanie (tak jest śmieszniej i bardziej realistycznie)
                let payment_sucess_random = Math.ceil(Math.random()*100+1);
                $("#pay").attr("disabled","disabled")
                $("#back2Shop").attr("disabled","disabled")
                if(payment_sucess_random <= payment_sucess_chance){
                    setTimeout(function(){
                        gemsAmount += amount;
                        localStorage.setItem("gems",gemsAmount)
                        $("#gemsAmount").text(gemsAmount);
                        alert("Payment succeeded.");
                        $("#difficultySelectDiv").show();
                        $("#shop").hide();
                        $("#pay").removeAttr("disabled","disabled")//musi byc to samo inaczej wykonuje sie odrazu
                        $("#back2Shop").removeAttr("disabled","disabled");
                        $("#moneySound")[0].currentTime = 0;
                        $("#moneySound")[0].play();
                    },7000);
                }else{
                    setTimeout(function(){
                        alert("There was an error processing your payment.");
                        $("#difficultySelectDiv").show();
                        $("#shop").hide();
                        $("#pay").removeAttr("disabled","disabled")
                        $("#back2Shop").removeAttr("disabled","disabled")
                    },5000);
                }
                
                
            });

            //***************************************************************************
            //***************************************************************************   
            //***************************************************************************



        });

    </script>
</head>
<body>

    <audio id="clickSound" src="audio/UI/click.mp3" preload="auto"></audio>
    <div id="titleScreen">
        <audio loop id="bgm_menu" src="audio/music/magical_cure_love_shot.mp3" preload="auto" type="audio/mpeg"></audio>
        <img src="images/title.png" alt="title" id="titleLogo"> 
        <div class="ButtonWrapper">
            <span class="pulsingRing"></span>
            <button id="startBtn" class="prettyBtn">Play!♥</button>
        </div>
    </div>


    <audio id="mikuSound" src="audio/feedback/hmm.mp3" preload="auto"></audio>
    <div id="mainMenu">
        <div id="topBar">
            <div id="mikuLogo">
                <img src="images/site_logo.webp" class="headerLogo" alt="miku!"><img src="images/title.png" class="headerLogo"><!--Add a miku miku sound here!!-->
            </div>

            <div id="advertisementsDiv">
                <a href="#" class="adRedirect" target="_blank">
                    <img src="images/ads/1.jpg" class="advertisement" id="ad1">

                </a>
                <a href="#" class="adRedirect" target="_blank">

                </a>
                <a href="#" class="adRedirect" target="_blank">
                    <img src="images/ads/4.jpg" class="advertisement" id="ad4">
                </a>
            </div>
            <!--przycisk ciężko kliknąć, ale działa.-->
            <div id="currencies">
                <div class="itemBox">
                    <p id="energy">⚡︎ <span id="lifesAmount">24</span>/<span id="lifesMax">24</span><span id="timeRemaining">00:00</span><button class="storeRedirect">+</button></p>
                </div>
                <div class="itemBox">
                    <p id="gems"><span id="gemsAmount" >0</span><button class="storeRedirect">+</button></p>
                </div>
            </div>
        </div>
        <div id="difficultySelectDiv">
            <audio id="easySound" src="audio/feedback/easy_game_begin.wav" preload="auto"></audio>
            <audio id="normalSound" src="audio/feedback/medium_game_start.wav" preload="auto"></audio>
            <audio id="hardSound" src="audio/feedback/hard_game_begin.wav" preload="auto"></audio>

            <div id="difficultyImages">
                <img src="images/larp.png" alt="easy" data-difficulty="easy" class="difficultySelect">

                <img src="images/enjoyer.png" alt="hard" data-difficulty="hard" class="difficultySelect">

                <button id="playBtn" class="prettyBtn" disabled>Play!♥</button>
            </div>

        </div>
    
    
        <div id="shop">
            <div id="catalouge">

                    <div id="inventory">
                        <table id="offers">
                            <!--=======================!!TEMPLATEE!!!!===================
                            <div class="offer">
                                <img src="images/shop/50gems.png">
                                <div class="productInfo">
                                    <p class="productName">50 gems</p>

                        -->
                        </table>
                    </div>

                    <img src="images/shop/support_poor_young_adults_please.png">
                </div>
            </div>
            <audio id="moneySound" src="audio/UI/moneymoneymoney.mp3" preload="auto"></audio>
            <div id="payment">
                <button class="backBtn" id="back2shop">X</button>
    
                <form id="paymentDetails" class="formPretty">

                    
                    <div class="formGroup">
                        <input type="text" id="name" placeholder="Name" class="formInput">
                    </div>

                    <div class="formGroup">
                        <input type="text" id="lastName" placeholder="Last Name" class="formInput">
                    </div>

                    <div class="formGroup">
                        <input type="email" id="email" placeholder="E-mail" class="formInput">
                    </div>

                    <div class="formGroup">
                        <input type="tel" id="phone" placeholder="Phone" class="formInput">
                    </div>

                    <div class="formGroup fullWidth">
                        <input type="text" id="address1" placeholder="Address line 1" class="inputLong">
                    </div>

                    <div class="formGroup fullWidth">
                        <input type="text" id="address2" placeholder="Address line 2" class="inputLong">
                    </div>

                    <div class="formGroup">
                        <input type="text" id="city" placeholder="City" class="formInput">
                    </div>

                    <div class="formGroup">

                    <div class="formGroup fullWidth">

    <div id="game">

                <p>Highscore: <span id="moves"></span></p>

            </div>
            <div id="playlist">
                <div id ="trackInfo">
                    <img src="audio/music/covers/placeholder.jpg" alt="album cover" id="albumCover">
                    <span id="title">Nothing is playing...</span>

                    <span id="artist"></span>
                    <audio controls id="songControls"></audio>
                </div>
                <div id="trackSelect">

                        <img src="audio/music/covers/cherrypop.png" class="previewCover">

                        <div class="previewInfo">
