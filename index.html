<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/4.0.0/jquery.min.js"></script>
    <title>Miku Miku Match</title>
    <link rel="icon" type="image/x-icon" href="images/site_icon.ico">
    <link rel="stylesheet" href="style/style.css">
    <link href='https://fonts.googleapis.com/css?family=Bubblegum Sans' rel='stylesheet'>
    <script>
        $(function(){

            $("#titleLogo").show();
            $('#startBtn').on('mouseenter', function() {
                const sound = $('#hoverSound')[0];
                sound.currentTime = 0;
                sound.play();
            });
            $('#startBtn').click(function() {
                const sound = $('#clickSound')[0];
                sound.currentTime = 0;
                sound.play();
            });

            let musicPlaying = false;//z automatu nie leci :( limitacje przegladarki

            $(document).on("mousemove",function(){
                if(!musicPlaying){
                    const music = $("#bgm_menu")[0];
                    music.currentTime = 0;
                    music.play();
                    musicPlaying = true;
                }
            })

        })
    </script>
</head>
<body>
    <audio id="hoverSound" src="audio/UI/hover.mp3" preload="auto"></audio>
    <audio id="clickSound" src="audio/UI/click.mp3" preload="auto"></audio>
    <div id="titleScreen">
        <audio loop id="bgm_menu" src="audio/music/magical_cure_love_shot.mp3" preload="auto" type="audio/mpeg"></audio>
        <img src="images/title.png" alt="title" id="titleLogo"> 
        <div class="playButtonWrapper">
            <span class="pulsingRing"></span>
            <button id="startBtn">Play!♥</button>
        </div>
    </div>
    <div id="mainMenu">
        <header id="topBar">
            <p id="energy">⚡︎ <span id="lifesAmount">null</span></p>
        </header>
        <div id="difficultySelect">
            <img src="images/larp.png" alt="easy" id="larpDifficulty" class="difficultySelect">
            <img src="images/casual.png" alt="normal" id="casualDifficulty" class="difficultySelect">
            <img src="images/enjoyer.png" alt="hard" id="enjoyerDifficulty" class="difficultySelect">
        </div>
    
        <div id="shop">
            <div id="payment">
                <form id="paymentDetails">
                </form>
            </div>
        </div>
    </div>
    <div id="game">
        <main id="gameTable"></main>
        <aside id="sideBar">
            <div id="gameInfo">
                
            </div>
            <div id="playlist">

            </div>
        </aside>
    </div>
</body>
</html>
