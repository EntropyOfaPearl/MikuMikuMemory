<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/4.0.0/jquery.min.js"></script>
    <title>Miku Miku Match</title>
    <link rel="icon" type="image/x-icon" href="images/site_icon.ico">
    <link rel="stylesheet" href="style/style.css">
    <link href='https://fonts.googleapis.com/css?family=Bubblegum Sans' rel='stylesheet'>
    <script>
        $(function(){

            $("#titleLogo").show();
            $('.prettyBtn').on('mouseenter', function() {
                const sound = $('#hoverSound')[0];
                sound.currentTime = 0;
                sound.play();
            });
            $('.prettyBtn').click(function() {
                const sound = $('#clickSound')[0];
                sound.currentTime = 0;
                sound.play();
                $("#titleScreen").hide();
                $("#mainMenu").show().css("display","flex");
            });

            $(".headerLogo").eq(0).click(function(){
                const sound = $('#mikuSound')[0];
                sound.currentTime = 0;
                sound.play();
            })

            let musicPlaying = false;//z automatu nie leci :( limitacje przegladarki

            $(document).on("mousemove",function(){
                if(!musicPlaying){
                    const music = $("#bgm_menu")[0];
                    music.currentTime = 0;
                    music.volume = 0.5;
                    music.play();
                    musicPlaying = true;
                }
            })

            //ads switching up <3 gotta make money
        
            counter = 0;
            setInterval(function(){
                let adLinks = ["https://piapro.net/intl/en.html", "https://games4you.pl/produkt/hatsune-miku-project-mirai-dx-3ds/","https://open.spotify.com/artist/7HwMt9qpoww4yfE3D8886I","https://store.steampowered.com/app/1761390/Hatsune_Miku_Project_DIVA_Mega_Mix/"];
                for (let i = 1; i <= 4; i++) {
                    let imageNumber = ((i + counter - 1) % 4) + 1;
                    $(".adRedirect").eq(i-1).attr("href", adLinks[imageNumber-1]);
                    $("#ad" + i).attr("src", `images/ads/${imageNumber}.jpg`);
                }
                if(counter < 4) counter +=1; else counter = 0;
     
            },500);


            let selectedDifficulty;

            $(".difficultySelect").click(function(){
                selectedDifficulty = $(this).data("difficulty");
                let soundEffect = $(`#${selectedDifficulty}Sound`)[0];
                soundEffect.volume = 1;
                soundEffect.currentTime = 0;
                soundEffect.play();
                $(this).addClass("difficultySelected");
                $(this).removeClass("unfocused")
                let everythingElse = $(".difficultySelect").not(this);
                everythingElse.addClass("unfocused");
                everythingElse.removeClass("difficultySelected");
                
            });

            $(".storeRedirect").click(function(){
                $("#difficultySelectDiv").hide();
                $("#shop").show();

            })


            $("#playBtn").click(function(){
                $("#mainMenu").hide();

                $("#game").show();
            })

            


        });

    </script>
</head>
<body>
    <audio id="hoverSound" src="audio/UI/hover.mp3" preload="auto"></audio>
    <audio id="clickSound" src="audio/UI/click.mp3" preload="auto"></audio>
    <div id="titleScreen">
        <audio loop id="bgm_menu" src="audio/music/magical_cure_love_shot.mp3" preload="auto" type="audio/mpeg"></audio>
        <img src="images/title.png" alt="title" id="titleLogo"> 
        <div class="ButtonWrapper">
            <span class="pulsingRing"></span>
            <button id="startBtn" class="prettyBtn">Play!♥</button>
        </div>
    </div>


    <audio id="mikuSound" src="audio/feedback/hmm.mp3" preload="auto"></audio>
    <div id="mainMenu">
        <div id="topBar">
            <div id="mikuLogo">
                <img src="images/site_logo.webp" class="headerLogo" alt="miku!"><img src="images/title.png" class="headerLogo"><!--Add a miku miku sound here!!-->
            </div>

            <div id="advertisementsDiv">
                <a href="#" class="adRedirect" target="_blank">
                    <img src="images/ads/1.jpg" class="advertisement" id="ad1">
                </a>
                <a href="#" class="adRedirect" target="_blank">
                    <img src="images/ads/2.jpg" class="advertisement" id="ad2">
                </a>
                <a href="#" class="adRedirect" target="_blank">
                    <img src="images/ads/3.jpg" class="advertisement" id="ad3">
                </a>
                <a href="#" class="adRedirect" target="_blank">
                    <img src="images/ads/4.jpg" class="advertisement" id="ad4">
                </a>
            </div>
            <!--przycisk ciężko kliknąć, ale działa.-->
            <div id="currencies">
                <div class="itemBox">
                    <p id="energy">⚡︎ <span id="lifesAmount">20</span>/20 <button class="storeRedirect">+</button></p>
                </div>
                <div class="itemBox">
                    <p id="gems"><span id="gemsAmount" >0<button class="storeRedirect">+</button></p>
                </div>
            </div>
        </div>
        <div id="difficultySelectDiv">
            <audio id="easySound" src="audio/feedback/easy_game_begin.wav" preload="auto"></audio>
            <audio id="mediumSound" src="audio/feedback/medium_game_start.wav" preload="auto"></audio>
            <audio id="hardSound" src="audio/feedback/hard_game_begin.wav" preload="auto"></audio>
            <img src="images/select_diff_text.png" id="difficultySelectText">

            <div id="difficultyImages">
                <img src="images/larp.png" alt="easy" data-difficulty="easy" class="difficultySelect">
                <img src="images/casual.png" alt="normal" data-difficulty="medium" class="difficultySelect">
                <img src="images/enjoyer.png" alt="hard" data-difficulty="hard" class="difficultySelect">

                <button id="playBtn" class="prettyBtn">Play!♥</button>
            </div>

        </div>
    
    
        <div id="shop">
            <div id="catalouge">
            </div>
            <div id="payment">
                <form id="paymentDetails">
                    <label for="name">Name:</label>
                    <input type="text" id="name" placeholder="Name">
                    <label for="lastName">Last name:</label>
                    <input type="text" id="lastName" placeholder="Last Name">
                    <label for="email">E-mail:</label>
                    <input type="text" id="email" placeholder="E-mail">
                    <label for="phone">Phone number:</label>
                    <input type="text" id="phone" placeholder="Phone">
                    <label for="name">Address:</label>
                    <input type="text" id="address1" placeholder="Address line 1">
                    <input type="text" id="address2" placeholder="Address line 2">
                    <input type="text" id="city" placeholder="city">
                    <input type="text" id="zipCode" placeholder="Zip code">
                    <select id="country"><!--Add items in jquery in case Yugoslavia reunites (I wish)--></select>
                    <button id="forward">next</button>
                </form>
                <form id="cardDetails">
                    <input id="cardNumber" type="number" max="12" placeholder="Card Number">
                    <input type="text" id="expiration" placeholder="Exp/date">
                    <input type="text" id="cvv" placeholder="CVV">
                </form>
            </div>
        </div>
        </div>
    </div>
    <div id="game">
        <main id="gameTable"></main>
        <aside id="sideBar">
            <div id="gameInfo">
                
            </div>
            <div id="playlist">

            </div>
        </aside>
    </div>
    
    <div id="popUpMessage"></div>
</body>
</html>
